name: build
on:
  push:
    branches: [main, fix/directstorage-x2]
  pull_request:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - run: cmake --build build --config ${{ matrix.config }} --parallel 3
      - run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure
      - name: Upload patched portable build
        if: github.ref == 'refs/heads/fix/directstorage-x2' && matrix.config == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: xvalkyrie-directstorage-x2-windows
          path: |
            build/Release/xvalkyrie.exe
            build/Release/xvboot.exe
            LICENSE
            README.md
            THIRD-PARTY.md
          if-no-files-found: error
  format:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - run: pip install clang-format==18.1.8
      - shell: bash
        run: git ls-files -z 'src/*.c' 'src/*.cpp' 'src/*.hpp' 'tests/*.cpp' | xargs -0 clang-format --dry-run --Werror
